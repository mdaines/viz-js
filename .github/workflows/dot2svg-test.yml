name: Test dot2svg package

on:
  workflow_dispatch: {}
  push:
    branches-ignore:
      - v2
      - gh-pages
    paths:
      - "packages/dot2svg/**"
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - name: "Install in package directory"
        run: |
          npm clean-install --ignore-scripts
        working-directory: packages/dot2svg

      - name: "Run tests"
        run: |
          npm clean-install --ignore-scripts
          npm run test
        working-directory: packages/dot2svg
